name: Nginx preview syntax

on:
  pull_request:
    branches: [dev]
    paths:
      - 'services/nginx_rate_limit_preview.py'
      - 'services/nginx_settings_schema.py'
      - 'tests/test_nginx_rate_limit_syntax.py'
      - '.github/workflows/nginx-preview-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Nginx test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python -m pip install pytest
      - name: Validate generated preview in disposable config
        run: python -m pytest -q tests/test_nginx_rate_limit_syntax.py
