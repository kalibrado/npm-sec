name: Backend tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Nginx for real configuration validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx > /dev/null
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build React preview
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      - name: Syntax and Python tests
        env:
          APP_ENV: development
          SESSION_SECRET: ci-not-a-real-production-secret
          DEFAULT_ADMIN_PASSWORD: ci-password-not-in-production
          DB_FILE: /tmp/npm-sec-ci.db
          LOG_FILE: /tmp/npm-sec-ci.log
        run: |
          python -m compileall -q .
          node --test tests/typed_drafts_interactions.cjs
          node --check static/dashboard.js
          node --check static/sw.js
          python -m pytest -q
