# HTTP context security profile, versioned in npm-sec/dev.
# NPM native http_top.conf must contain only the include pointing here.
# GeoIP2 module loading remains in the existing root_top.conf.

limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=100r/s;

geoip2 /var/lib/geoip/GeoLite2-Country.mmdb {
    auto_reload 3h;
    $geoip2_data_country_code default=XX source=$remote_addr country iso_code;
    $geoip2_data_country_name default=- source=$remote_addr country names fr;
}
geoip2 /var/lib/geoip/GeoLite2-City.mmdb {
    auto_reload 3h;
    $geoip2_data_city_name default=- source=$remote_addr city names en;
    $geoip2_data_region_name default=- source=$remote_addr subdivisions 0 names en;
    $geoip2_data_postal_code default=- source=$remote_addr postal code;
    $geoip2_data_latitude default=0 source=$remote_addr location latitude;
    $geoip2_data_longitude default=0 source=$remote_addr location longitude;
}
geoip2 /var/lib/geoip/GeoLite2-ASN.mmdb {
    $geoip2_data_asn default=0 source=$remote_addr autonomous_system_number;
    $geoip2_data_isp default=- source=$remote_addr autonomous_system_organization;
}

geo $allowed_ip {
    default no;
    127.0.0.1 yes;
    192.168.1.0/24 yes;
}
map $geoip2_data_country_code $allowed_country {
    default $allowed_ip;
    FR yes;
}

map $http_user_agent $blocked_agent {
    default 0;
    ~*masscan 1;
    ~*zgrab 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nmap 1;
    ~*libredtail 1;
    ~*nuclei 1;
    ~*dirbuster 1;
    ~*gobuster 1;
}
map $http_user_agent $npm_security_empty_ua {
    default 0;
    "" 1;
}

# Preserve existing trust boundaries on initial migration.
# IMPORTANT: ranges are broad; review exact proxy addresses and
# real_ip_header before enabling forwarded-client-IP restoration.
set_real_ip_from 192.168.1.0/24;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;

geo $remote_addr $exclude_from_log {
    default 1;
    127.0.0.1 0;
    192.168.1.0/24 0;
    172.16.0.0/12 0;
    10.0.0.0/8 0;
}

# NPM SEC's dynamic policy is defined once, only here.
include /data/nginx/custom/npm-security/npm-blocklist.conf;

# Report policy decisions, not a misleading country-only value.
# This does not imply that a backend's HTTP status is a security decision.
map "$allowed_country:$blocked_agent:$npm_security_deny:$npm_security_empty_ua" $npm_security_effective_allowed {
    default no;
    "yes:0:0:0" yes;
}

log_format detailed_visitor escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"host":"$host",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"country_code":"$geoip2_data_country_code",'
      '"country_name":"$geoip2_data_country_name",'
      '"city":"$geoip2_data_city_name",'
      '"latitude":"$geoip2_data_latitude",'
      '"longitude":"$geoip2_data_longitude",'
      '"asn":"$geoip2_data_asn",'
      '"isp":"$geoip2_data_isp",'
      '"allowed":"$npm_security_effective_allowed",'
      '"legacy_allowed_country":"$allowed_country",'
      '"blocked_agent":"$blocked_agent",'
      '"npm_security_policy_mode":"$npm_security_policy_mode",'
      '"npm_security_would_deny":"$npm_security_would_deny",'
      '"npm_security_deny":"$npm_security_deny"'
    '}';

log_format custom '$remote_addr - $geoip2_data_country_code '
                  '"$request" $status $body_bytes_sent '
                  '"$http_user_agent" allowed=$npm_security_effective_allowed';

# Original HTTP-level logging retained. Server-level access_log directives
# override its inheritance for proxy hosts (same as the user's legacy config).
access_log /data/logs/access-geo-detailed.log detailed_visitor if=$exclude_from_log;
access_log /data/logs/access-custom.log custom if=$exclude_from_log;

add_header X-Debug-Country $allowed_country;
add_header X-Country-Code $geoip2_data_country_code;
add_header X-Country-Name $geoip2_data_country_name;
add_header X-City $geoip2_data_city_name;
add_header X-Visitor-IP $remote_addr;
add_header X-Served-By $host;
