# Proxy-server context profile, versioned in npm-sec/dev.
# NPM native server_proxy.conf must only include this file.

# Preserve existing server-level access logs. HTTP-level exclusions do
# not apply to these server logs, as on the original installation.
access_log /data/logs/access-geo-detailed.log detailed_visitor;
access_log /data/logs/access-custom.log custom;

# Legacy protections stay active independently of NPM SEC observe/block.
# Unknown or non-FR countries are allowed only if the local-IP map permits.
if ($allowed_country = "no") {
    return 444;
}
if ($blocked_agent = 1) {
    return 444;
}
if ($npm_security_empty_ua = 1) {
    return 444;
}

# Dynamic NPM SEC engine: global/per-host, trust overrides, observe/block.
# This supersedes the older unconditional blocked_ip/blocked_country checks.
include /data/nginx/custom/npm-security/npm-server-guard.conf;

limit_req zone=req_limit_per_ip burst=70 nodelay;
limit_req_status 429;

# Keep the effective, last-occurring proxy headers from the legacy file.
# Host, Forwarded and buffering directives still depend on NPM location
# inheritance; check the effective nginx -T during the site-specific review.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Scheme $scheme;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Country-Code $geoip2_data_country_code;
proxy_set_header X-City $geoip2_data_city_name;
proxy_set_header X-User-Agent $http_user_agent;
proxy_set_header X-Referer $http_referer;
proxy_set_header Accept-Encoding "";

proxy_buffering off;
proxy_intercept_errors on;

error_page 400 /error_pages/400.html;
error_page 401 /error_pages/401.html;
error_page 403 /error_pages/403.html;
error_page 404 /error_pages/404.html;
error_page 405 /error_pages/405.html;
error_page 407 /error_pages/407.html;
error_page 408 /error_pages/408.html;
error_page 409 /error_pages/409.html;
error_page 410 /error_pages/410.html;
error_page 411 /error_pages/411.html;
error_page 412 /error_pages/412.html;
error_page 413 /error_pages/413.html;
error_page 416 /error_pages/416.html;
error_page 418 /error_pages/418.html;
error_page 429 /error_pages/429.html;
error_page 500 /error_pages/500.html;
error_page 502 /error_pages/502.html;
error_page 503 /error_pages/503.html;
error_page 504 /error_pages/504.html;
error_page 505 /error_pages/505.html;

location /error_pages/ {
    alias /data/nginx/error_pages/ghost/;
    internal;
}

location ~ /\.(?!well-known).* {
    deny all;
}
location ~* /\.(env|git|svn|hg|ht|bash|sh|ini|yaml|yml).* {
    deny all;
}
location ~* /(eval-stdin|phpunit|adminer|phpmyadmin|wp-login|xmlrpc|shell)\.php {
    deny all;
}
